<!DOCTYPE html>
<html>
    <head>
        <title>Ex03</title>
        <style>
            td {
                width: 80px;
                height: 40px;
            }

            table {
                border-collapse: collapse;
                width: 60%;
            }

            th, td {
                border: 1px solid black;
            }
        </style>
    </head>
    <body>
        <table>
            <tr>
                <th>Noir</th>
                <th>Rouge</th>
                <th>Bleu</th>
                <th>Vert</th>
            </tr>

            {% for row in shades %}
            <tr>
                <td style="background-color: {{ row.noir }}"></td>
                <td style="background-color: {{ row.rouge}}"></td>
                <td style="background-color: {{ row.bleu }}"></td>
                <td style="background-color: {{ row.vert }}"></td>
            </tr>
            {% endfor %}
        </table>
    </body>
</html>
